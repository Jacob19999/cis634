# Extended benchmark: more frozen encoders + ablations from the proposal.
#  - "best paragraph vs whole report": doc_mode whole truncates at the model's max length
#  - BM25 that keeps negation words (standard stopword lists delete "not", "no", "never")
name: extended
device: auto
depth: 100
chunking: {max_words: 150, overlap_sentences: 1}

systems:
  - {name: bm25, type: bm25, params: {stopwords: english}}
  - {name: bm25-keepneg, type: bm25, params: {stopwords: english_keep_negation}}
  - {name: bm25-whole, type: bm25, params: {doc_mode: whole}}

  - {name: minilm, type: dense, params: {model: sentence-transformers/all-MiniLM-L6-v2, max_seq_length: 256}}
  - {name: minilm-whole, type: dense, params: {model: sentence-transformers/all-MiniLM-L6-v2, max_seq_length: 256, doc_mode: whole}}

  - name: e5-small
    type: dense
    params: {model: intfloat/e5-small-v2, query_prefix: "query: ", passage_prefix: "passage: ", max_seq_length: 512}
  - name: e5-small-whole
    type: dense
    params: {model: intfloat/e5-small-v2, query_prefix: "query: ", passage_prefix: "passage: ", max_seq_length: 512, doc_mode: whole}

  # Additional frozen encoders (same size class and one size up)
  - name: bge-small
    type: dense
    params: {model: BAAI/bge-small-en-v1.5, max_seq_length: 512,
             query_prefix: "Represent this sentence for searching relevant passages: ", pair_prefix: ""}
  - name: mpnet
    type: dense
    params: {model: sentence-transformers/all-mpnet-base-v2, max_seq_length: 384}
  - name: e5-base
    type: dense
    params: {model: intfloat/e5-base-v2, query_prefix: "query: ", passage_prefix: "passage: ", max_seq_length: 512}

  - {name: hybrid-bm25-e5, type: hybrid, params: {components: [bm25, e5-small], method: rrf, k: 60, depth: 1000}}
  - {name: hybrid-bm25-bge, type: hybrid, params: {components: [bm25, bge-small], method: rrf, k: 60, depth: 1000}}

evaluation:
  synopsis: {split: validation, n_queries: 1000, seed: 13}
  topical:
    queries: data/queries/topical_v1.yaml
    human_qrels: [data/qrels/human_v1.tsv]
  contrast: {path: data/contrast/contrast_v1.jsonl}
