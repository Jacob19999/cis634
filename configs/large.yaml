# Larger frozen encoders: does model size close the gap to BM25?
# Two size ladders (BGE and E5: 33M -> 110M -> 335M) plus Qwen3-Embedding-0.6B, an
# LLM-based, instruction-following embedder. The small/base models are already cached from
# the extended run, so they only re-encode queries and give in-run significance tests.
# Full-index time on an M1 Max (MPS), GPU to itself: bge-large ~45 min, Qwen3-0.6B ~105 min (fp16).
# Results: results/large/summary.md.
# Qwen3-4B/8B would take ~12 h+ here; see configs/large_gpu.yaml for a CUDA run.
name: large
device: auto
depth: 100
chunking: {max_words: 150, overlap_sentences: 1, min_tail_words: 40}

systems:
  - {name: bm25, type: bm25, params: {stopwords: english}}
  - {name: bm25-whole, type: bm25, params: {doc_mode: whole}}

  # BGE ladder (CLS pooling, query instruction only)
  - name: bge-small
    type: dense
    params: {model: BAAI/bge-small-en-v1.5, max_seq_length: 512,
             query_prefix: "Represent this sentence for searching relevant passages: ", pair_prefix: ""}
  - name: bge-base
    type: dense
    params: {model: BAAI/bge-base-en-v1.5, max_seq_length: 512, batch_size: 32,
             query_prefix: "Represent this sentence for searching relevant passages: ", pair_prefix: ""}
  - name: bge-large
    type: dense
    params: {model: BAAI/bge-large-en-v1.5, max_seq_length: 512, batch_size: 32,
             query_prefix: "Represent this sentence for searching relevant passages: ", pair_prefix: ""}

  # E5 ladder (mean pooling, query:/passage: prefixes)
  - name: e5-small
    type: dense
    params: {model: intfloat/e5-small-v2, query_prefix: "query: ", passage_prefix: "passage: ", max_seq_length: 512}
  - name: e5-base
    type: dense
    params: {model: intfloat/e5-base-v2, query_prefix: "query: ", passage_prefix: "passage: ", max_seq_length: 512, batch_size: 32}
  - name: e5-large
    type: dense
    params: {model: intfloat/e5-large-v2, query_prefix: "query: ", passage_prefix: "passage: ", max_seq_length: 512, batch_size: 32}

  # Qwen3-Embedding (last-token pooling; instruction on the query side only, per the model
  # card). Both variants share the passage embeddings, so the second costs only queries:
  # the domain-specific instruction vs. the model card's generic web-search one. (The generic
  # one won on synopses, MRR@10 0.371 vs 0.303, p < 0.001; topical was not significantly different.)
  - name: qwen3-0.6b
    type: dense
    params: {model: Qwen/Qwen3-Embedding-0.6B, max_seq_length: 512, batch_size: 32, dtype: float16,
             query_prefix: "Instruct: Given a short description of an aviation safety event, retrieve passages from pilot and controller incident reports that describe it\nQuery:",
             pair_prefix: "Instruct: Retrieve semantically similar text\nQuery:"}
  - name: qwen3-0.6b-generic
    type: dense
    params: {model: Qwen/Qwen3-Embedding-0.6B, max_seq_length: 512, batch_size: 32, dtype: float16,
             query_prefix: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:",
             pair_prefix: "Instruct: Retrieve semantically similar text\nQuery:"}

  - {name: hybrid-bm25-bge, type: hybrid, params: {components: [bm25, bge-small], method: rrf, k: 60, depth: 1000}}
  - {name: hybrid-bm25-bge-large, type: hybrid, params: {components: [bm25, bge-large], method: rrf, k: 60, depth: 1000}}
  - {name: hybrid-bm25-qwen3, type: hybrid, params: {components: [bm25, qwen3-0.6b], method: rrf, k: 60, depth: 1000}}
  - {name: hybrid-bm25-qwen3-generic, type: hybrid, params: {components: [bm25, qwen3-0.6b-generic], method: rrf, k: 60, depth: 1000}}

evaluation:
  synopsis: {split: validation, n_queries: 1000, seed: 13}
  topical:
    queries: data/queries/topical_v1.yaml
    human_qrels: [data/qrels/human_v1.tsv]
  contrast: {path: data/contrast/contrast_v1.jsonl}
