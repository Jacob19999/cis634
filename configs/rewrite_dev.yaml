# Do LLM query rewrites with FAA glossary context help? Dev-split comparison of each system
# with its original queries, the rewrite appended to the query, and the rewrite alone.
# Rewrites: scripts/rewrite_queries.py configs/rewrite_dev.yaml (Qwen3-8B, prompt pcg_v1).
# Same dev queries as configs/expand_dev.yaml: topical dev split, synopsis queries from train.
# Needs the Qwen3 embeddings cached by configs/large_gpu.yaml (CUDA machine).
name: rewrite_dev
data_dir: data/processed
cache_dir: cache
results_dir: results
device: auto
depth: 100
chunking: {max_words: 150, overlap_sentences: 1, min_tail_words: 40}

systems:
  - {name: bm25, type: bm25, params: &bm25 {k1: 1.2, b: 0.75, stopwords: english}}
  - {name: bm25-rw-append, type: bm25,
     params: {<<: *bm25, query_rewrites: &rw data/queries/rewrites/qwen3-8b_pcg_v1.jsonl}}
  - {name: bm25-rw-replace, type: bm25, params: {<<: *bm25, query_rewrites: *rw, rewrite_mode: replace}}

  - name: e5-small
    type: dense
    params: &e5 {model: intfloat/e5-small-v2, query_prefix: "query: ", passage_prefix: "passage: ",
                 max_seq_length: 512}
  - {name: e5-small-rw-append, type: dense, params: {<<: *e5, query_rewrites: *rw}}
  - {name: e5-small-rw-replace, type: dense, params: {<<: *e5, query_rewrites: *rw, rewrite_mode: replace}}

  - name: qwen3-0.6b
    type: dense
    params: &q06 {model: Qwen/Qwen3-Embedding-0.6B, max_seq_length: 512, batch_size: 32, dtype: float16,
                  query_prefix: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:",
                  pair_prefix: "Instruct: Retrieve semantically similar text\nQuery:"}
  - {name: qwen3-0.6b-rw-append, type: dense, params: {<<: *q06, query_rewrites: *rw}}
  - {name: qwen3-0.6b-rw-replace, type: dense, params: {<<: *q06, query_rewrites: *rw, rewrite_mode: replace}}

  - {name: qwen3-8b, type: dense, params: &q8 {<<: *q06, model: Qwen/Qwen3-Embedding-8B, batch_size: 16}}
  - {name: qwen3-8b-rw-append, type: dense, params: {<<: *q8, query_rewrites: *rw}}
  - {name: qwen3-8b-rw-replace, type: dense, params: {<<: *q8, query_rewrites: *rw, rewrite_mode: replace}}

evaluation:
  synopsis: {split: train, n_queries: 1000, seed: 13}
  topical:
    queries: data/queries/topical_v1.yaml
    splits: [dev]
