name: smoke
device: auto
depth: 20
chunking:
  max_words: 150
  overlap_sentences: 1
systems:
- name: bm25
  type: bm25
- name: minilm
  type: dense
  params:
    model: sentence-transformers/all-MiniLM-L6-v2
- name: hybrid
  type: hybrid
  params:
    components:
    - bm25
    - minilm
    depth: 100
evaluation:
  synopsis:
    split: validation
    n_queries: 50
    seed: 1
  topical:
    queries: data/queries/topical_v1.yaml
  contrast:
    path: data/contrast/contrast_v1.jsonl
data_dir: data/processed
cache_dir: cache
results_dir: results
