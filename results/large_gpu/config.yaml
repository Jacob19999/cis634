name: large_gpu
device: auto
depth: 100
chunking:
  max_words: 150
  overlap_sentences: 1
  min_tail_words: 40
systems:
- name: bm25
  type: bm25
  params:
    stopwords: english
- name: bm25-whole
  type: bm25
  params:
    doc_mode: whole
- name: qwen3-0.6b-generic
  type: dense
  params:
    model: Qwen/Qwen3-Embedding-0.6B
    max_seq_length: 512
    batch_size: 32
    dtype: float16
    query_prefix: 'Instruct: Given a web search query, retrieve relevant passages
      that answer the query

      Query:'
    pair_prefix: 'Instruct: Retrieve semantically similar text

      Query:'
- name: qwen3-0.6b-whole
  type: dense
  params:
    model: Qwen/Qwen3-Embedding-0.6B
    max_seq_length: 2048
    batch_size: 8
    dtype: float16
    query_prefix: 'Instruct: Given a web search query, retrieve relevant passages
      that answer the query

      Query:'
    pair_prefix: 'Instruct: Retrieve semantically similar text

      Query:'
    doc_mode: whole
- name: qwen3-4b
  type: dense
  params:
    model: Qwen/Qwen3-Embedding-4B
    max_seq_length: 512
    batch_size: 16
    dtype: float16
    query_prefix: 'Instruct: Given a web search query, retrieve relevant passages
      that answer the query

      Query:'
    pair_prefix: 'Instruct: Retrieve semantically similar text

      Query:'
- name: qwen3-8b
  type: dense
  params:
    model: Qwen/Qwen3-Embedding-8B
    max_seq_length: 512
    batch_size: 16
    dtype: float16
    query_prefix: 'Instruct: Given a web search query, retrieve relevant passages
      that answer the query

      Query:'
    pair_prefix: 'Instruct: Retrieve semantically similar text

      Query:'
- name: hybrid-bm25-qwen3-generic
  type: hybrid
  params:
    components:
    - bm25
    - qwen3-0.6b-generic
    method: rrf
    k: 60
    depth: 1000
- name: hybrid-bm25-qwen3-4b
  type: hybrid
  params:
    components:
    - bm25
    - qwen3-4b
    method: rrf
    k: 60
    depth: 1000
- name: hybrid-bm25-qwen3-8b
  type: hybrid
  params:
    components:
    - bm25
    - qwen3-8b
    method: rrf
    k: 60
    depth: 1000
evaluation:
  synopsis:
    split: validation
    n_queries: 1000
    seed: 13
  topical:
    queries: data/queries/topical_v1.yaml
    human_qrels:
    - data/qrels/human_v1.tsv
  contrast:
    path: data/contrast/contrast_v1.jsonl
data_dir: data/processed
cache_dir: cache
results_dir: results
