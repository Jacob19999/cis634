[project]
name = "asrsbench"
version = "0.1.0"
description = "Benchmark lexical, dense and hybrid retrieval of NASA ASRS aviation safety reports (CIS 634 NLP project)"
requires-python = ">=3.10"
authors = [{ name = "Jacob Tang" }, { name = "Aarambh Shrestha" }]
dependencies = [
    "datasets>=2.18",
    "sentence-transformers>=3.0",
    "torch>=2.1",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "PyStemmer>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "bm25s>=0.2", "matplotlib>=3.8", "openTSNE>=1.0"]

[project.scripts]
asrsbench = "asrsbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
